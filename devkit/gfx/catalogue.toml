# The screens `aw2dev gfx` renders (fast harness runs) and what it checks on them. Nothing here is game data: pictures, dumps and golden frames are made
# locally from your ROM. Add a screen = add a [[screen]] block (docs/dev/graphics.md); every past graphics bug should have one.
#
# runner: harness (tango-gamesupport-aw2/examples/<script>.txt run by aw2_room_teams) | offline_tabs (tokens for aw2_offline_tabs)
# variants: name -> { ds = true (load the Dual Strike pack), env = {...} }
# shots: names of the BMPs the run writes; `f{00..29}` expands. vram = true adds `vram NAME` after each shot (dumps for the tile guard / explain)
# checks: which detectors run (text same golden stray tiles palette frames); a failing harness exit code is always a finding.

[[screen]]
name = "banner_5p"
what = "NEXT TURN hand-off banners of the five armies; the font tiles must not be overwritten by the Black Cannon's art (past bug: 'NE RN / ORA TAR / RESS A BUTTO')"
runner = "harness"
script = "aw2_banner_5p"
vram = true
shots = ["ho{1..5}_s0"]
checks = ["same", "golden", "tiles", "palette"]
variants = { plain = {}, pack = { ds = true, env = { AW2_SHARED_ART = "1" } } }
same = [{ variants = ["plain", "pack"], region = [0, 50, 240, 60], tolerance = 0.0 }]
golden = { tolerance = 0.002 }
# OBJ tiles 989..1004 and 1007..1022 are the game's font (OBJ charblock at VRAM 0x10000, 32 bytes a tile)
guard = [{ name = "font OBJ tiles 989..1022", dump = "ho1", range = [0x17BA0, 0x17FE0] }]

[[screen]]
name = "maplist_scroll"
what = "offline Versus SELECT MAP, the 2P list scrolled past row 34 one DOWN at a time, every frame read: names must be whole (past bug: 'erChannel Ci' when the text-tile cache overflowed into the preview tiles)"
runner = "offline_tabs"
tokens = "DDDDDDDDDDDDDDDDDDDDDDDDDDDDDD GGGGGGGGGGGGGG"
shots = ["g{00..13}_{00..11}"]
checks = ["text", "frames"]
variants = { pack = { ds = true, env = { AW2_SHARED_ART = "1" } } }
text = [{ region = [5, 72, 72, 78], ink = [131, 123, 115], in_set = "maps", max_unknown = 0 }]

[[screen]]
name = "colours_ship_5p"
what = "waiting window of a 5P room: a moved Cruiser keeps its owner's colours (past bug: drawn in the viewer's blue, BG palette banks 8..15 not restored)"
runner = "harness"
script = "aw2_waiting_colours_ship_5p"
checks = ["palette"]
palette = { rc = true }
shots = []
variants = { default = { env = { AW2_SAMPLE = "10" } } }   # (the script is run with AW2_SAMPLE=10: its window checks need the sampled frames)

[[screen]]
name = "mapsel_logo"
what = "5P pick screen: nothing but sea between the picking plate and the counters box at the top (past bug: stray tile fragments beside the SELECT*MAP logo during the roulette)"
runner = "harness"
script = "aw2_mapsel_5p"
checks = ["stray"]
shots = ["priv_a_s0", "priv_b_s0"]
stray = [{ region = [138, 1, 8, 12], dist = 90, tolerance = 0.02, what = "sea beside the plate" }]
variants = { pack = { ds = true, env = { AW2_SHARED_ART = "1" } } }

[[screen]]
name = "armysel_faces"
what = "SELECT YOUR ARMY with every CO's small face and the partner icons (past bugs: Sturm's face, Von Bolt's face (the old man in his machine), the partner icon palette)"
runner = "example"
exe = "aw2_armysel_preview"
checks = ["golden"]
shots = ["armysel_2", "armysel_3", "armysel_3_partner", "armysel_5", "faces_c{0..5}", "faces_f{0..9}"]
variants = { pack = { ds = true } }
golden = { tolerance = 0.0005 }

[[screen]]
name = "hud_header_2p"
what = "Fog off, 2 seats: a waiting window's HUD header is its own army's colour in every frame (past bug: the mover's colour on the waiting window)"
runner = "harness"
script = "aw2_waiting_hud_2p_nofog"
checks = ["external"]
shots = []
variants = { default = { env = { AW2_SAMPLE = "1", AW2_DUMP = "{out}/dump" } } }
external = [{ cmd = ["python3", "{repo}/tools/hud_check.py", "{dump}", "1", "red", "945"], what = "seat 1 never shows a red header" },
            { cmd = ["python3", "{repo}/tools/hud_check.py", "{dump}", "0", "blue", "945"], what = "seat 0 never shows a blue header" }]

[[screen]]
name = "roulette_5p"
what = "5P room: the map roulette (the title's place is the plate; nothing of the logo or the map's picture may show round it) and the army page that follows (the Rules map-name plate must not land on it)"
runner = "harness"
script = "aw2_mapsel_5p"
checks = ["golden"]
shots = ["rl{1..8}_s0", "teams_s0", "ap{1..5}_s0"]
variants = { pack = { ds = true, env = { AW2_SHARED_ART = "1" } } }
golden = { tolerance = 0.0005 }
script_edit = { insert_before = [{ match = "until teams", lines = ["wait 90", "shotall rl1", "wait 90", "shotall rl2", "wait 90", "shotall rl3", "wait 90", "shotall rl4", "wait 90", "shotall rl5", "wait 90", "shotall rl6", "wait 90", "shotall rl7", "wait 90", "shotall rl8"] }], append = ["wait 100", "press 0 A", "press 1 A", "press 2 A", "press 3 A", "press 4 A", "wait 40", "shotall ap1", "press 0 A", "press 1 A", "press 2 A", "press 3 A", "press 4 A", "wait 40", "shotall ap2", "press 0 A", "press 1 A", "press 2 A", "press 3 A", "press 4 A", "wait 40", "shotall ap3", "press 0 A", "press 1 A", "press 2 A", "press 3 A", "press 4 A", "wait 40", "shotall ap4", "wait 200", "shotall ap5"] }

# ---- past bugs brought back (patch = a diff of src/ against HEAD in devkit/gfx/regressions, or env); `aw2dev gfx regress` requires each to be flagged ----
[[bug]]
name = "banner_font_clobber"
what = "the north Black Cannon art written over the font's OBJ tiles (2b4e12a20): garbled NEXT TURN"
patch = "banner_font_clobber.patch"
screens = ["banner_5p"]

[[bug]]
name = "maplist_text_cache"
what = "the map list's text-tile cache restarting at every redraw (fb91e6d98): garbled rows mid-scroll"
patch = "maplist_text_cache.patch"
screens = ["maplist_scroll"]

[[bug]]
name = "unit_recolour"
what = "only BG palette bank 11 restored after the waiting view's refresh (a69b1a9ac): ships in the viewer's colours"
env = { AW2_RESTORE_BANKS = "11" }
screens = ["colours_ship_5p"]

[[bug]]
name = "armysel_von_bolt"
