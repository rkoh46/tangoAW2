syntax = "proto3";

package tango.signaling;

message Packet {
  message Hello {
    message ICEServer {
      optional string credential = 1;
      optional string username = 2;
      repeated string urls = 3;
    }
    repeated ICEServer ice_servers = 1;
  }

  message Start {
    uint32 protocol_version = 1;
    string offer_sdp = 2;
    bytes connection_id = 3;
  }

  // Field 2 was the relaying server's view of the peer's mTLS client-certificate
  // fingerprint — an install identity clients presented on the signaling
  // websocket. Requiring a client certificate breaks browsers, so the scheme is
  // gone; the field stays reserved on both messages so nothing collides on the
  // wire with a peer or server that still sends it.
  message Offer {
    string sdp = 1;
    reserved 2;
  }

  message Answer {
    string sdp = 1;
    reserved 2;
  }

  // A single trickled ICE candidate, relayed by the server to the peer after
  // the SDP exchange. `candidate` is the SDP `a=candidate:...` payload.
  message IceCandidate { string candidate = 1; }

  message Abort {
    enum Reason {
      REASON_UNKNOWN = 0;
      REASON_PROTOCOL_VERSION_TOO_OLD = 1;
      REASON_PROTOCOL_VERSION_TOO_NEW = 2;
      REASON_MISSING_SESSION_ID = 3;
      REASON_NOT_UPGRADE = 4;
    }

    Reason reason = 1;
  }

  message Ping {}

  oneof which {
    Hello hello = 4;
    Start start = 1;
    Offer offer = 2;
    Answer answer = 3;
    Abort abort = 5;
    Ping ping = 6;
    IceCandidate ice_candidate = 7;
  }
}
