# Cassius, the cavalry commander and Klaus's rival (docs/dev/co-kit.md).
id = "cassius"
name = "Cassius"
army = "emerald_sun"
role = "Emerald Sun's cavalry commander, a reckless rival"

short = "Cass"          # used only on a plate the full name does not fit (see `aw2dev co check`)
full_name = "Cassius Rufus"
theme = "co:eagle"
bio = "Commander of the Emerald Sun cavalry and the Senate's favourite, who thinks the legion should be his. Hit: Speed. Miss: Patience."
luck = [10, 10, 10]
stars = { cop = 3, scop = 7 }

# "vehicle" = the ground vehicles: Recon, APC, Tank, Md. Tank, Megatank, Neotank, Piperunner and Anti-Air (the Megatank and the Piperunner count as vehicles, not as indirect units: the owner's ruling; pinned by `aw2dev co verify` `vehicles`).

[d2d]
name = "Impetus"
text = "My vehicles move 1 space more and hit 10% harder, but their armour is 10% thinner."
mods = [ { units = "vehicle", move = 1, attack = 10, defence = -10 } ]

[cop]
name = "Charge"
text = "Vehicles move 1 more space and attack 30% harder."
mods = [ { units = "vehicle", move = 1, attack = 30 } ]
quote = ["With me! Ride them down!", "Glory is a short road!"]

[scop]
name = "Triumph"
text = "Vehicles move 1 more space, attack 40% harder, and can move again after attacking, once."
mods = [ { units = "vehicle", move = 1, attack = 40 } ]
rules = [ "a vehicle that has attacked may move once more (not attack again) in the same turn" ]
quote = ["Strike, and strike again!", "They will sing of this!"]

[lines]
tag_in = ["Try to keep up, Klaus."]
victory = "Ha! Write it down, scribe. Write it down!"
defeat = "Not like this. NOT like this!"

[portrait]
# The picture the project owner supplied for this CO: the one data line of the mapping (swap two lines to swap two COs; the framing is in the picture's own `.toml`).
source = "art-src/cos/cassius_v5.jpg"
