# Clone Andy, Black Hole's copy of Andy (docs/dev/co-kit.md, "Recolour-based COs"). He is Dual Strike's Andy under another name (`crate::co_new`): his numbers, powers and quotes are Andy's, and
# his pictures are Andy's with the PALETTE recoloured: nothing is drawn or edited, only the 16 colours every picture of him is indexed in (the large art, mug, mini, HUD face, name plate's CO palette,
# the tag screen's figure) change, so the shading reads as it does on Andy.
id = "cloneandy"
name = "Clone"          # (the name plate graphic reads "Clone", cut from AW2's letters; the CO page says Clone Andy)
full_name = "Clone Andy"
army = "black_hole"
role = "Black Hole's copy of Andy, made to fight for it"
theme = "co:adder"
luck = [10, 10, 10]
bio = "Black Hole's copy of Andy, made to fight for it. Cheerful, tireless and never doubts an order. Hit: Orders Miss: Giving up"
stars = { cop = 3, scop = 6 }

[d2d]
name = "Andy's own"
text = "No real weaknesses. Proficient with air, sea, and land units. Ready to fight wherever and whenever."
mods = []

[cop]
name = "Hyper Repair"
text = "Restores two HP to all units."
mods = []

[scop]
name = "Hyper Upgrade"
text = "Restores five HP to all units. Firepower rises, and unit movement increases by one space."
heal = 5
mods = []

[portrait]
# The picture is Dual Strike's Andy (palette scheme 0 .. 7, the same colour roles in each): `base` names it, `recolour` replaces palette entries (index = "RRGGBB"). Andy's roles
# (found by lighting each index on his large art): 1 white rim; 2..6 skin, light to dark (face, hands); 7 and 8 hair; 9 and 10 the jacket (red, dark red); 11 and 14 the buckle; 12 the shirt
# (collar and sleeves, pink); 13 the star badge; 15 the outline; 0 transparent. No entry is shared between skin and anything else. Hair, the star, the buckle, rim and outline are kept.
base = "andy"

[portrait.recolour]
# the skin ramp, five tones: pale to mid blue
2 = "BED7FF"
3 = "96B9F0"
4 = "6E96D7"
5 = "5073B9"
6 = "375596"
# the jacket and the shirt: charcoal, three tones (the shirt the lightest, as on Andy)
9 = "40404C"
10 = "262630"
12 = "6E6E7D"
