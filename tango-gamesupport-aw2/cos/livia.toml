# Livia, senator and treasurer (docs/dev/co-kit.md).
id = "livia"
name = "Livia"
army = "emerald_sun"
role = "Emerald Sun's senator and treasurer"

full_name = "Livia Valeria"
theme = "co:colin"
bio = "Senator and treasurer of the Emerald Sun. She wins wars with ledgers, not swords. Hit: Accounts Miss: Mud"
luck = [10, 10, 10]
stars = { cop = 3, scop = 6 }

# The HQ the army of this CO shows on the map (docs/dev/army-packs.md): the id of an army skin (`skins/<id>.toml`), whose HQ picture (in the army's own building colours) replaces
# the HQ of the CO's country. "default" keeps the game's. The HQ follows the CO that starts the battle (a Tag pair: the lead). Checked by `aw2dev co verify` (facet `hq`).
hq = "emerald_sun"

[d2d]
name = "Ledger"
text = "Properties yield 25% more funds, but units cost 10% more."
mods = [ { units = "all", cost = 10 } ]
income = 25

[cop]
name = "Tribute"
text = "Collects 200 funds for every property owned."
tribute = 200
quote = ["Thank you for your", "generous contribution."]

[scop]
name = "Mare Nostrum"
text = "Naval units move 2 spaces more, and their firepower rises by 30%. Collects 100 funds for every property owned."
mods = [ { units = "naval", move = 2, attack = 30 } ]
tribute = 100
quote = ["The sea is ours. Again.", "Send the fleet!"]

[lines]
tag_in = ["A moment. I am counting."]
victory = "The books balance. So does the war."
defeat = "Impossible. I audited this."

[portrait]
# The picture the project owner supplied for this CO: the one data line of the mapping (swap two lines to swap two COs; the framing is in the picture's own `.toml`).
source = "art-src/cos/livia_v5.jpg"
