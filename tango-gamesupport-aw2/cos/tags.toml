# Tag Powers of the Silver Nova pairs (docs/dev/co-kit.md, docs/dev/silver-nova.md). `compat` is the firepower the Tag Power gives in percent (Dual Strike's
# compatibility byte, 65..130; the Tag Power itself fires both Super Powers); `stars` the pair's rating, 1..3, as in Sturm's table
# (`sturm_pairs.rs`: 110 is 1 star, 115 and 118 and 120 are 2, 125 is 3). A pair of two CO ids from the roster; `ds:`/`aw2:` ids name an existing CO.
# Every unlisted pair is 95.

[[pair]]
a = "tabitha"
b = "lili"
compat = 120
stars = 2
name = "Two Hands"
why = "the sisters: her cruelty and the little one's toys"

[[pair]]
a = "tabitha"
b = "caulder"
compat = 108
stars = 1
name = "Family Ties"
why = "daughter and father: he watches, she tolerates it"

[[pair]]
a = "lili"
b = "caulder"
compat = 115
stars = 2
name = "Bedtime Story"
why = "the youngest and the experimenter who broke her"

