# Klaus, the Legate: Emerald Sun's chief commander (docs/dev/co-kit.md). Portrait recipes: donor parts from the player's ROMs + our own overlays.
id = "klaus"
name = "Klaus"
army = "emerald_sun"
role = "the Legate, Emerald Sun's chief commander"

full_name = "Klaus Aurelius Varo"
theme = "co:kanbei"          # placeholder: AW2's own song until the music kit makes one
bio = "Legate of the Emerald Sun, a stern and fair soldier's soldier. Hit: Discipline Miss: Being doubted"
luck = [10, 10, 10]           # AW2 rows are 0..9 percent most days
# Stars: the CO Power's, and the Super Power's in all (Dual Strike's convention; AW2's Hawke is 5 / 9, Kanbei 4 / 7, Eagle 3 / 9, Sturm 0 / 10).
# A power's `mods` are on top of the day-to-day ones; every power also adds Dual Strike's own +10% firepower.
stars = { cop = 4, scop = 8 }

# The HQ the army of this CO shows on the map (docs/dev/army-packs.md): the id of an army skin (`skins/<id>.toml`), whose HQ picture (in the army's own building colours) replaces
# the HQ of the CO's country. "default" keeps the game's. The HQ follows the CO that starts the battle (a Tag pair: the lead). Checked by `aw2dev co verify` (facet `hq`).
hq = "emerald_sun"

[d2d]
name = "Imperium"
text = "All units possess superior offense and defense. Infantry and Mech units fight best of all."
mods = [ { units = "all", attack = 10, defence = 10 }, { units = "foot", attack = 10, defence = 10 } ]

[cop]
name = "Testudo"
text = "Defense rises by 20%, and foot soldiers move 1 more space. Enemy counters to his attacks are weaker."
mods = [ { units = "all", defence = 20 }, { units = "foot", move = 1 } ]
rules = [ "enemy counterattacks against Klaus's attacks deal 25% less damage" ]
quote = ["Shields up! Close ranks,", "and not one step back!"]

[scop]
name = "Legio Aeterna"
text = "Restores 3 HP, adds 1 space of movement and 20% firepower. Foot soldiers gain 40% firepower and defense."
mods = [ { units = "all", attack = 20, move = 1 }, { units = "foot", attack = 40, defence = 40 } ]
heal = 3
quote = ["The legion does not fall.", "Rise, and march again!"]

[lines]
tag_in = ["Hold the line."]
victory = "Order restored. March at dawn."
defeat = "The legion... will remember."

[portrait]
# The picture the project owner supplied for this CO: the one data line of the mapping (swap two lines to swap two COs; the framing is in the picture's own `.toml`).
source = "art-src/cos/klaus_v5.jpg"
