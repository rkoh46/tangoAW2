# Aurelia, the siege engineer (docs/dev/co-kit.md).
id = "aurelia"
name = "Aurelia"
army = "emerald_sun"
role = "Emerald Sun's siege engineer"

short = "Aurel"          # used only on a plate the full name does not fit (see `aw2dev co check`)
full_name = "Aurelia Faustina"
theme = "co:grit"
bio = "Chief engineer of the Emerald Sun. If a wall stands, she knows how it falls. Hit: Range. Miss: Walking."
luck = [10, 10, 10]
stars = { cop = 3, scop = 7 }

[d2d]
name = "Ballistics"
text = "My Artillery and Rockets reach 1 space farther, and my indirect units hit 10% harder. My tanks and other vehicles hit 10% softer."
mods = [ { units = "artillery rockets", range = 1 }, { units = "indirect", attack = 10 }, { units = "vehicle", attack = -10 } ]

[cop]
name = "Ballista"
text = "Indirect units reach 1 more space and attack 30% harder."
mods = [ { units = "indirect", range = 1, attack = 30 } ]
quote = ["Wind the windlass!", "Let the walls hear it!"]

[scop]
name = "Onager"
text = "Indirect units reach 1 more space and attack 30% harder, and each of their hits also costs enemy units next to the target 1 HP."
mods = [ { units = "indirect", range = 1, attack = 30 } ]
rules = [ "an indirect hit deals 1 HP of splash to every enemy unit adjacent to the target (hidden units too, never below 1 HP)" ]
quote = ["Loose the onagers!", "Stone for every wall!"]

[lines]
tag_in = ["Measure twice. Fire once."]
victory = "The wall is down. Fetch the ladders."
defeat = "Bad footing. Next time, higher ground."

[portrait]
# The picture the project owner supplied for this CO: the one data line of the mapping (swap two lines to swap two COs; the framing is in the picture's own `.toml`).
source = "art-src/cos/aurelia_user.jpg"
