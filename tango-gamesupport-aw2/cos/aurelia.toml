# Aurelia, the siege engineer (docs/dev/co-kit.md).
id = "aurelia"
name = "Aurelia"
army = "emerald_sun"
role = "Emerald Sun's siege engineer"

short = "Aurel"          # used only on a plate the full name does not fit (see `aw2dev co check`)
full_name = "Aurelia Faustina"
theme = "co:grit"
bio = "Siege engineer of the Emerald Sun. She thinks in arcs and angles. Hit: Range Miss: Walking"
luck = [10, 10, 10]
stars = { cop = 3, scop = 7 }

# "vehicle" = the ground vehicles: Recon, APC, Tank, Md. Tank, Megatank, Neotank, Piperunner and Anti-Air (the Megatank and the Piperunner count as vehicles, not as indirect units: the owner's ruling; pinned by `aw2dev co verify` `vehicles`).

# The HQ the army of this CO shows on the map (docs/dev/army-packs.md): the id of an army skin (`skins/<id>.toml`), whose HQ picture (in the army's own building colours) replaces
# the HQ of the CO's country. "default" keeps the game's. The HQ follows the CO that starts the battle (a Tag pair: the lead). Checked by `aw2dev co verify` (facet `hq`).
hq = "emerald_sun"

[d2d]
name = "Ballistics"
text = "Artillery and Rockets gain 1 space of range, and all indirect units have 10% more firepower. Vehicles are 10% weaker."
mods = [ { units = "artillery rockets", range = 1 }, { units = "indirect", attack = 10 }, { units = "vehicle", attack = -10 } ]

[cop]
name = "Ballista"
text = "Indirect units gain 1 more space of range, and their firepower rises by 30%."
mods = [ { units = "indirect", range = 1, attack = 30 } ]
quote = ["Wind the windlass!", "Let the walls hear it!"]

[scop]
name = "Onager"
text = "Indirect units gain 1 more space of range and 30% firepower. Each of their hits also costs enemy units next to the target 1 HP."
mods = [ { units = "indirect", range = 1, attack = 30 } ]
rules = [ "an indirect hit deals 1 HP of splash to every enemy unit adjacent to the target (hidden units too, never below 1 HP)" ]
quote = ["Loose the onagers!", "Stone for every wall!"]

[lines]
tag_in = ["Measure twice. Fire once."]
victory = "The wall is down. Fetch the ladders."
defeat = "Bad footing. Next time, higher ground."

[portrait]
# The picture the project owner supplied for this CO: the one data line of the mapping (swap two lines to swap two COs; the framing is in the picture's own `.toml`).
source = "art-src/cos/aurelia_v5.jpg"
