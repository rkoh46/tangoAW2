# Asuka, Black Hole's intelligence chief (docs/dev/co-kit.md, docs/dev/asuka.md). Sonja after she defects: Sonja's kit (Dual Strike's numbers: vision, hidden HP, enemy terrain stars, luck) with
# Hawke's mass-HP powers on top. Her numbers are Sonja's Dual Strike block (co_roster.rs `ds_co`) and her powers' HP effect AW2's Black Wave / Black Storm (co_new.rs, asuka.rs): this file says them
# for `aw2dev co check` / `balance` and for the CO page's wording. She is in every list of this build (not behind the playtest flag) but not in the Emerald Sun Campaign (`aw2dev campaign check`).
id = "asuka"
name = "Asuka"
army = "black_hole"
role = "Black Hole's chief of intelligence"
# Black Hole's own HQ (her CO row's country; not an army skin, so the game draws its own: tests/test_asuka_pictures.py `asuka_pics_hq_follows_the_co`).
hq = "black_hole"

full_name = "Asuka"
theme = "own:asuka"
bio = "Kanbei's daughter. She defected to Black Hole, took a new name and leads its invasion. Hit: Secrets Miss: Surprises"
luck = [20, 20, 20]          # Nell's day-to-day maximum roll (her powers: 60 and 100; Asuka's keep 20)
bad_luck = [0, 0, 0]
movement = "sturm"           # every terrain costs 1 for her ground units (his row's charts)
stars = { cop = 3, scop = 9 }                 # Eagle's meter (3 / 9 in AW2's and Dual Strike's tables)

[d2d]
name = "Black Insight"
text = "Firepower and defense rise by 5%, and vision by 1. Her HP is hidden, enemy cover drops 1 star, luck is good and terrain costs 1."
mods = [ { units = "all", attack = 5, defence = 5 } ]
vision = 1
hidden_hp = true
terrain_cut = 1

[cop]
name = "Dark Intel"
text = "All units recover 1 HP; enemies lose 1 HP and half their ammo and fuel. Vision +2, cover -2 stars."
mods = []
halve_enemy_ammo_fuel = true
vision = 2
terrain_cut = 2
hp_own = 1
hp_enemy = 1
quote = ["I have read your", "every move. Observe."]

[scop]
name = "Event Horizon"
text = "All units recover 2 HP; enemies lose 2 HP and half their ammo and fuel. Cover -3 stars; her units strike first."
mods = []
halve_enemy_ammo_fuel = true
vision = 2
terrain_cut = 3
strike_first = true
hp_own = 2
hp_enemy = 2
quote = ["Event Horizon. Nothing", "escapes it. Not even you."]

[lines]
tag_in = ["Updating the file."]
victory = "As projected. Black Hole advances."
defeat = "A variable I did not log."

[portrait]
# The picture the project owner supplied (upscaled pixel art on white: `pixelart = true` in the framing file beside it). Imported as it is, facing right like AW2's COs. asuka_v1.jpg stays in art-src as the illustration importer's test input.
source = "art-src/cos/asuka_v2.png"
flip = false
