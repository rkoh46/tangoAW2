# Varro, the Consul of Aurea: the Emerald Sun Campaign's final boss (crate::es_co). A Roman: his army shows the Emerald Sun HQ. Numbers: es_co.rs.
id = "varro"
name = "Varro"
army = "aurea"
role = "Consul of Aurea, the boss of the Emerald Sun Campaign"
theme = "co:hawke"
luck = [10, 10, 20]
bio = "Imperator of the Emerald Sun and Klaus's old patron. Grand and ruthless. Hit: Patronage Miss: Being refused"
stars = { cop = 4, scop = 8 }
# Roman: the Emerald Sun HQ, drawn in his own army's building colours (the skin's HQ picture takes the army's palette).
hq = "emerald_sun"

[d2d]
name = "Imperator"
text = "All units are better paid, better armed and better fed. Firepower and defense rise by 15%."
mods = [ { units = "all", attack = 15, defence = 15 } ]

[cop]
name = "Edict"
text = "Firepower rises by 25% and defense by 15% more, and unit movement increases by 1 space."
mods = [ { units = "all", attack = 25, defence = 15, move = 1 } ]
quote = ["By the Consul's authority,", "the Senate decrees..."]

[scop]
name = "Sol Invictus"
text = "Restores 2 HP to all units. Firepower rises by 45% and defense by 30%, and movement increases by 1 space."
mods = [ { units = "all", attack = 45, defence = 30, move = 1 } ]
heal = 2
quote = ["Sol Invictus! The sun", "does not set on Aurea!"]

[portrait]
# a Dual Strike CO's face stands in until his own is drawn (crate::es_co::INFO donor)
placeholder = true
