# Aria, Commander of the New Accord (docs/dev/co-kit.md, docs/dev/aria.md). Nell's sister, an Orange Star CO: the final opponent of the BH2 Campaign (docs/BH2_CAMPAIGN.md section 9, branch bh2design)
# and Asuka's mirror. Her numbers are her own (src/aria.rs): +3% attack, +10% defence, Nell's luck, Sturm's movement; only a Super Power: heals 3, +1 move, +20% / +30%, a day's income at once. Not in the Emerald Sun Campaign.
id = "aria"
name = "Aria"
army = "orange_star"
role = "Commander of the New Accord, Nell's sister"
# Orange Star's own HQ and colours (her CO row's country, not an army skin).
hq = "default"

full_name = "Aria"
# Placeholder: Nell's song until her own is ready (branch bh2music, tango-gamesupport-aw2/music/bh2/aria.m4t, "Last Accord"); then `theme = "own:aria"` and a row in es_music::SOURCES.
theme = "co:nell"
bio = "Nell's sister, and Commander of the New Accord. She rebuilt the Allied army from the ground up and never leaves a soldier to stand alone. Hit: Teamwork Miss: Going it alone"
luck = [20, 20, 20]          # Nell's day-to-day maximum roll (as Asuka's), no bad luck
bad_luck = [0, 0, 0]
movement = "sturm"           # every terrain costs 1 for her ground units (his row's charts), as Asuka's
# Only a Super Power, like Dual Strike's Von Bolt: no CO Power (no Power entry in the menu, no COP stars, the AI never tries one). The Super Power costs 7 stars.
stars = { cop = 0, scop = 7 }

[d2d]
name = "Common Cause"
text = "Common Cause: my units attack 3% harder and take 10% less damage, my luck is good and every terrain costs 1 to cross."
mods = [ { units = "all", attack = 3, defence = 10 } ]

[cop]
# No CO Power (stars.cop = 0): the CO page says so, as AW2 says of Sturm.
name = ""
text = "Aria has no CO Power. She saves all her energy for her Super CO Power."

[scop]
name = "Build Anew"
text = "All my units recover 3 HP, move 1 space more, attack 20% harder and take 30% less damage. I collect a day's income at once."
mods = [ { units = "all", attack = 20, defence = 30, move = 1 } ]
heal = 3
# Funds: an immediate grant equal to one day's income (the Funds rule x the properties that earn), once, when the power is used.
income_grant = true
quote = ["BUILD ANEW! From these", "ashes, we rise again!"]

[lines]
tag_in = ["Stand with me."]
victory = "The Accord stands. Now we build."
defeat = "Then build it better than I did."

[portrait]
# The picture the project owner supplied (pixel art, its "transparent" background a checkerboard baked into the JPEG: `checker = true` in the framing file beside it). A direct import, facing right as supplied.
source = "art-src/cos/aria_v1.jpg"
flip = true
