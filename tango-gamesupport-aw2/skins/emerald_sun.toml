# Emerald Sun: tangoAW2's own sixth army, inspired by the Jade Sun of Advance Wars By Web.
# Everything in this file is original work of this repository (GPL-3.0-or-later): colours and
# pixel art drawn here, applied at run time on top of Advance Wars 2's own graphics read from
# the player's ROM. Nothing from AWBW or from any game is copied. Format: docs/dev/army-packs.md.

id = "emerald_sun"
name = "Emerald Sun"
short = "ES"

# Colours are RRGGBB. The body ramp of every unit and building, light to dark: weathered jade,
# a cool grey-green (verdigris stone), far from Green Earth's leaf green.
[colours]
# Pale emerald grey: a sage stone with a faint jade tint (greyer and lighter than leaf green or teal), its buildings pale green.
ramp = ["DEE4C0", "BECB9E", "A0AB85", "7E8769", "464A3B", "292C23"]
# The buildings (cities, bases, the HQ ...) are paler and greener than the units, light to dark.
building = ["D6FFB8", "B7E396", "90AB78", "6C8555"]
# The trim greys of AW2's unit palette (tracks, barrels, metal, the cheek plate): steel.
trim = ["BDBBA8", "8F8D7F", "665E53"]
# Crests, plumes and sun rays: legion red.
crest = "D02C3C"
# The sun itself on the emblem and the HQ (also entry 14 of every building palette).
gold = "E8C25A"
gold_dark = "A87C2C"
# A unit that has moved: its own dimmed ramp (how much of the ramp's hue the grey keeps, and how bright it stays).
moved_tint = 0.4
moved_dim = 0.58

# ---- Infantry and Mech: AW2's soldiers in the stone ramp wearing a Roman crested helmet ----------------------------
# The picture is 16x16, three idle frames. `.` keeps AW2's pixel, `_` clears it, a hex digit is a unit palette index
# (2..7 the stone ramp light to dark, b c d the steel trim light to dark, 1 white, e the crest red, f the outline). A patch
# with `moving = [..]` is also laid on those frames of the moving sheet (0..2 facing sideways, 3..5 front, 6..8 back),
# placed so its `anchor` (a point of `rows`) lies on the left outline of the helmet's top row.
[infantry]
base = 3

# side view: AW2's soldier in the stone ramp, a red crest across the top of the helmet (spiked, higher at the back) and a steel cheek plate down the side of the face
[[infantry.patch]]
x = 0
y = 0
moving = [0, 1, 2]
anchor = [6, 1]
rows = [
  "........e.ee.e..",
  "......eeeeeeeee.",
  ".....feefeefeef.",
  "................",
  "................",
  "................",
  "................",
  "...........cd...",
  "...........cd...",
]

# front: the crest seen head on
[[infantry.patch]]
frames = []
moving = [3, 4, 5]
anchor = [3, 2]
rows = [
  "....e.e.e...",
  "...eeeeeee..",
  "...feefeef..",
]

# back: the same crest from behind
[[infantry.patch]]
frames = []
moving = [6, 7, 8]
anchor = [3, 2]
rows = [
  "....e.e.e...",
  "...eeeeeee..",
  "...feefeef..",
]

[mech]
base = 3

# the Mech's head sits a pixel left and up of the Infantry's, with the launcher on its right
[[mech.patch]]
frames = [0, 1]
x = 0
y = 0
moving = [0, 1, 2]
anchor = [5, 0]
rows = [
  "......e.ee.e....",
  ".....eeeeeeeee..",
  ".....eefeefe....",
  "................",
  "................",
  "................",
  "..........cd....",
  "..........cd....",
]

[[mech.patch]]
frames = [2]
x = 0
y = 1
rows = [
  "......e.ee.e....",
  ".....eeeeeeeee..",
  ".....eefeefe....",
  "................",
  "................",
  "................",
  "..........cd....",
  "..........cd....",
]

[[mech.patch]]
frames = []
moving = [3, 4, 5]
anchor = [3, 2]
rows = [
  "....e.e.e...",
  "...eeeeeee..",
  "...feefeef..",
]

# back: the launcher hides the right of the head
[[mech.patch]]
frames = []
moving = [6, 7, 8]
anchor = [1, 1]
rows = [
  "..e.e.",
  ".eeeee.",
  ".feefe.",
]

