y = 1
rows = [
  ".....feeeeef....",
  "....fb1bbbcdf...",
  ".....bbbbccd....",
  "....bbbbbbcd....",
  "....bbbbbbbbd...",
  "..........bcd...",
  "..........cdd...",
]

[[mech.patch]]
frames = []
moving = [3, 4, 5]
anchor = [3, 2]
