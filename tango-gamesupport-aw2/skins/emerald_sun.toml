# Emerald Sun: tangoAW2's own sixth army, inspired by the Jade Sun of Advance Wars By Web.
# Everything in this file is original work of this repository (GPL-3.0-or-later): colours and
# pixel art drawn here, applied at run time on top of Advance Wars 2's own graphics read from
# the player's ROM. Nothing from AWBW or from any game is copied. Format: docs/dev/army-packs.md.

id = "emerald_sun"
name = "Emerald Sun"
short = "ES"

# Colours are RRGGBB. The body ramp of every unit and building, light to dark: weathered jade,
# a cool grey-green (verdigris stone), far from Green Earth's leaf green.
[colours]
# Pale emerald grey: a sage stone with a faint jade tint (greyer and lighter than leaf green or teal), its buildings pale green.
ramp = ["DEE4C0", "BECB9E", "A0AB85", "7E8769", "464A3B", "292C23"]
# The buildings (cities, bases, the HQ ...) are paler and greener than the units, light to dark.
building = ["D6FFB8", "B7E396", "90AB78", "6C8555"]
# The trim greys of AW2's unit palette (tracks, barrels, metal, the cheek plate): steel.
trim = ["BDBBA8", "8F8D7F", "665E53"]
# Crests, plumes and sun rays: legion red.
crest = "D02C3C"
# The crest's dark, the plume's shade in the battle scenes.
crest_dark = "8E1B28"
# The sun itself on the emblem and the HQ (also entry 14 of every building palette).
gold = "E8C25A"
gold_dark = "A87C2C"
# A unit that has moved: its own dimmed ramp (how much of the ramp's hue the grey keeps, and how bright it stays).
moved_tint = 0.4
moved_dim = 0.64
moved_lift = 0.3

# ---- Infantry and Mech: AW2's soldiers in the stone ramp in a closed Roman galea: a steel face guard with an eye slit and a long red plume sweeping back ---------
# The picture is 16x16, three idle frames. `.` keeps AW2's pixel, `_` clears it, a hex digit is a unit palette index
# (2..7 the stone ramp light to dark, b c d the steel trim light to dark, 1 white, e the crest red, f the outline). A patch
# with `moving = [..]` is also laid on those frames of the moving sheet (0..2 facing sideways, 3..5 front, 6..8 back),
# placed so its `anchor` (a point of `rows`) lies on the left outline of the helmet's top row.
[infantry]
base = 3

# side view: the plume sweeps back in one diagonal blade over the helmet, the face guard covers the face down to the chin with a dark eye slit
[[infantry.patch]]
x = 4
y = 0
moving = [0, 1, 2]
anchor = [2, 1]
rows = [
  "......eee.",
  "....eeee..",
  "..eeee....",
  "..........",
  "..........",
  ".bbbbbbbcd",
  "fccccccccd",
  "..bf.bbcd.",
  "..bbbbcd..",
]

# front: the plume is a thin fin over the helmet, the face guard a steel plate with the eye slit
[[infantry.patch]]
frames = []
moving = [3, 4, 5]
anchor = [3, 2]
rows = [
  ".....ee.....",
  ".....ee.....",
  "...f2ee3f...",
  "..f23ee34f..",
  "..f33ee44f..",
  ".fcbbbbbbcf.",
  ".fcccccccdf.",
  ".fbffffffbf.",
  "..cbbbbbcd..",
]

# back: the plume's fin and its tail over the neck guard
[[infantry.patch]]
frames = []
moving = [6, 7, 8]
anchor = [3, 2]
rows = [
  ".....ee.....",
  ".....ee.....",
  "...f2ee3f...",
  "..f23ee34f..",
  "..f33ee44f..",
  ".fbbbbbbbbf.",
  ".fcccceccdf.",
  ".....ee.....",
  ".....e......",
]

[mech]
base = 3

# the Mech's head sits a pixel left and up of the Infantry's, with the launcher on its right: a shorter plume
[[mech.patch]]
frames = [0, 1]
x = 3
y = 0
moving = [0, 1, 2]
anchor = [2, 0]
rows = [
  "....eeee.",
  "..eeee...",
  ".........",
  ".........",
  "fbbbbbbbc",
  "fcccccccc",
  "..bf.bbcd",
  "..bbbbcd.",
]

[[mech.patch]]
frames = [2]
x = 3
y = 1
rows = [
  "....eeee.",
  "..eeee...",
  ".........",
  ".........",
  "fbbbbbbbc",
  "fcccccccc",
  "..bf.bbcd",
  "..bbbbcd.",
]

[[mech.patch]]
frames = []
moving = [3, 4, 5]
anchor = [3, 2]
rows = [
  ".....ee.....",
  ".....ee.....",
  "...f2ee3f...",
  "..f23ee34f..",
  "..f33ee44f..",
  ".fcbbbbbbcf.",
  ".fcccccccdf.",
  ".fbffffffbf.",
  "..cbbbbbcd..",
]

# back: the launcher hides the right of the head
[[mech.patch]]
frames = []
moving = [6, 7, 8]
anchor = [1, 1]
rows = [
  ".feef",
  "f2eecf",
  "f3eecf",
  "fcbbdf",
]

# ---- Battle scenes and the unit panel's portrait: the same helmet at the figures' size ---------------------------------------------------------------------
# The figures are 32x32 pictures (16 tiles) whose helmet is a block of 12x9 army-coloured pixels (palette entries 2..5) above the face (the skin tones,
# entries 8..10); `rows` (a hex digit is the figure palette's entry: 7 the outline, b c d the steel greys, e the skin's crest red, f its dark; `.` keeps the pixel)
# are laid at (x, y) from that block's top-left corner on every frame that has one (a figure falling over has none and is left as it is).

# Infantry in battle: the plume sweeps back from the crown, a steel face guard with a dark eye slit
[battle.infantry]
dome = [12, 9]
x = 2
y = -3
rows = [
