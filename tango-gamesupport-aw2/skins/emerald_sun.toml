# Silver Nova: tangoAW2's own sixth army (until 2026-11 Emerald Sun; the file keeps its id `emerald_sun`, which the CO data files name).
# The HQ is the project owner's own pixel art, imported faithfully (art-src/silver-nova/hq.jpg, `aw2dev armyskin import-hq`); the yellow windows and the green orb come from the owner's
# pictures (art-src/silver-nova/hq.jpg, city_ref.jpg); the palette is the owner's pick, bright chrome. The soldiers' helmets, the emblem and the rest are original work of this
# repository (GPL-3.0-or-later), applied at run time on top of Advance Wars 2's own graphics read from the player's ROM. Format: docs/dev/army-packs.md.

id = "emerald_sun"
name = "Silver Nova"
short = "SN"

# Colours are RRGGBB. The body ramp of every unit and building, light to dark: silver metal (chrome pulled down from the first pick, which read white on the grass): one white highlight, then neutral to faintly cool greys, hard contrast. Tuned to stay clear of Black Hole's light greys, the done greys and the fog (`aw2dev armyskin check`).
[colours]
ramp = ["FFFFFF", "C5C5CD", "ACACB4", "9497A0", "363A44", "16181E"]
# The buildings (cities, bases, ...): white panels, a mid and a dark chrome grey (light to dark), so an owned city is far from an unowned one.
building = ["FFFFFF", "BCC1C9", "6C717C", "444852"]
# The trim greys of AW2's unit palette (tracks, barrels, metal, the cheek plate): steel.
trim = ["C4C7CE", "8A8E98", "4A4D55"]
# The plume's colours: no picture draws a plume any more (entries 14 and 15 of the unit palettes stay installed for a Silver Nova CO in another colour, unused).
crest = "FAFCFF"
crest_dark = "A4B3CB"
# The emblem's tones (the art's c, b, a: the sun's rays, its unused dark, its frame and disc): darker than the ramp's lights so the sun reads as shaded metal on the Teams card's white.
emblem_tones = ["B4B8C0", "3E424C", "6B707C"]
# The lit windows of the HQ (also entry 14 of every building palette): the yellow of the owner's pictures.
gold = "F6F782"
gold_dark = "B5B650"
# The orb of the HQ, light to dark: the owner's greens (building palette entries 12, 11 and 8, which only the HQs' pictures use).
orb = ["DBEB6E", "A5D86C", "72B073"]
# A unit that has moved: its own dimmed ramp (how much of the ramp's hue the grey keeps, and how bright it stays).
moved_tint = 0.0
moved_dim = 0.7
moved_lift = 0.15

# ---- Infantry and Mech: AW2's soldiers in the stone ramp with a steel face guard with an eye slit (the mask; the Roman plume is gone) ---------
# The picture is 16x16, three idle frames. `.` keeps AW2's pixel, `_` clears it, a hex digit is a unit palette index
# (2..7 the stone ramp light to dark, b c d the steel trim light to dark, 1 white, e the crest red, f the outline). A patch
# with `moving = [..]` is also laid on those frames of the moving sheet (0..2 facing sideways, 3..5 front, 6..8 back),
# placed so its `anchor` (a point of `rows`) lies on the left outline of the helmet's top row.
[infantry]
base = 3

# side view: the face guard covers the face down to the chin with a dark eye slit
[[infantry.patch]]
x = 4
y = 0
moving = [0, 1, 2]
anchor = [2, 1]
rows = [
  "..........",
  "..........",
  "..........",
  "..........",
  "..........",
  ".bbbbbbbcd",
  "fccccccccd",
  "..bf.bbcd.",
  "..bbbbcd..",
]

# front: the face guard a steel plate with the eye slit
[[infantry.patch]]
frames = []
moving = [3, 4, 5]
anchor = [3, 2]
rows = [
  "............",
  "............",
  "...f2..3f...",
  "..f23..34f..",
  "..f33..44f..",
  ".fcbbbbbbcf.",
  ".fcccccccdf.",
  ".fbffffffbf.",
  "..cbbbbbcd..",
]

# back: the neck guard
[[infantry.patch]]
frames = []
moving = [6, 7, 8]
anchor = [3, 2]
rows = [
  "............",
  "............",
  "...f2..3f...",
  "..f23..34f..",
  "..f33..44f..",
  ".fbbbbbbbbf.",
  ".fcccc.ccdf.",
  "............",
  "............",
]

[mech]
base = 3

# the Mech's head sits a pixel left and up of the Infantry's, with the launcher on its right
[[mech.patch]]
frames = [0, 1]
x = 3
y = 0
moving = [0, 1, 2]
anchor = [2, 0]
rows = [
  ".........",
  ".........",
  ".........",
  ".........",
  "fbbbbbbbc",
  "fcccccccc",
  "..bf.bbcd",
  "..bbbbcd.",
]

[[mech.patch]]
frames = [2]
x = 3
y = 1
rows = [
  ".........",
  ".........",
  ".........",
  ".........",
  "fbbbbbbbc",
  "fcccccccc",
  "..bf.bbcd",
  "..bbbbcd.",
]

[[mech.patch]]
frames = []
moving = [3, 4, 5]
anchor = [3, 2]
rows = [
  "............",
  "............",
  "...f2..3f...",
  "..f23..34f..",
  "..f33..44f..",
  ".fcbbbbbbcf.",
  ".fcccccccdf.",
  ".fbffffffbf.",
  "..cbbbbbcd..",
]

# back: the launcher hides the right of the head
[[mech.patch]]
frames = []
moving = [6, 7, 8]
anchor = [1, 1]
rows = [
  ".f..f",
  "f2..cf",
  "f3..cf",
  "fcbbdf",
]

# ---- Battle scenes and the unit panel's portrait: the same helmet at the figures' size ---------------------------------------------------------------------
# The figures are 32x32 pictures (16 tiles) whose helmet is a block of 12x9 army-coloured pixels (palette entries 2..5) above the face (the skin tones,
# entries 8..10); `rows` (a hex digit is the figure palette's entry: 7 the outline, b c d the steel greys, e the skin's crest red, f its dark; `.` keeps the pixel)
# are laid at (x, y) from that block's top-left corner on every frame that has one (a figure falling over has none and is left as it is).

