# Emerald Sun: tangoAW2's own sixth army, inspired by the Jade Sun of Advance Wars By Web.
# Everything in this file is original work of this repository (GPL-3.0-or-later): colours and
# pixel art drawn here, applied at run time on top of Advance Wars 2's own graphics read from
# the player's ROM. Nothing from AWBW or from any game is copied. Format: docs/dev/army-packs.md.

id = "emerald_sun"
name = "Emerald Sun"
short = "ES"

# Colours are RRGGBB. The body ramp of every unit and building, light to dark: weathered jade,
# a cool grey-green (verdigris stone), far from Green Earth's leaf green.
[colours]
ramp = ["94D5BD", "5AAC8B", "318B6A", "087352", "005241", "003929"]
# The trim greys of AW2's unit palette (tracks, barrels, metal): bronze.
trim = ["C4AC74", "967C4C", "685430"]
# Crests, plumes and sun rays: legion red.
crest = "D02C3C"
# The sun itself on the emblem and the HQ.
gold = "E8C25A"
gold_dark = "A87C2C"
# How much of the ramp the grey of a unit that has moved keeps (0..1).
moved_tint = 0.3

# ---- Infantry and Mech: AW2's Green Earth soldiers with a legion crest -----------------------
# The picture is 16x16, three idle frames. `.` keeps AW2's pixel, `_` clears it, a hex digit is a
# unit palette index (2..7 the body ramp light to dark, e the crest red, f the outline).
[infantry]
base = 3
[infantry.moving]
crest = true
[[infantry.patch]]
x = 0
y = 0
rows = [
  ".......fffffff..",
  "......feeeeeeef.",
  ".....f4213446fef",
  ".....f4212345fef",
]

[mech]
base = 3
[mech.moving]
crest = true
[[mech.patch]]
frames = [0, 1]
x = 0
y = 0
rows = [
  ".....feeeeeeef..",
  "....f4213446fef.",
]
[[mech.patch]]
frames = [2]
x = 0
y = 0
rows = [
  "......fffffff...",
  ".....feeeeeeef..",
  "....f4213446fef.",
]

