  ".....feeeeef....",
  "....fb1bbbcdf...",
  ".....bbbbccd....",
  "....bbbbbbcd....",
  "....bbbbbbbbd...",
  "..........bcd...",
  "..........cdd...",
]

[[mech.patch]]
frames = [2]
