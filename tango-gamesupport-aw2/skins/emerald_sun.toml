# Emerald Sun: tangoAW2's own sixth army, inspired by the Jade Sun of Advance Wars By Web.
# Everything in this file is original work of this repository (GPL-3.0-or-later): colours and
# pixel art drawn here, applied at run time on top of Advance Wars 2's own graphics read from
# the player's ROM. Nothing from AWBW or from any game is copied. Format: docs/dev/army-packs.md.

id = "emerald_sun"
name = "Emerald Sun"
short = "ES"

# Colours are RRGGBB. The body ramp of every unit and building, light to dark: weathered jade,
# a cool grey-green (verdigris stone), far from Green Earth's leaf green.
[colours]
# Pale emerald grey: a stone with a faint jade tint (greyer and lighter than leaf green or teal).
ramp = ["D8F6D6", "B6D4B4", "96B394", "779375", "597458", "2F482F"]
# The trim greys of AW2's unit palette (tracks, barrels, metal, and the helmets): bronze.
trim = ["C4AC74", "967C4C", "685430"]
# Crests, plumes and sun rays: legion red.
crest = "D02C3C"
# The sun itself on the emblem and the HQ (also entry 14 of every building palette).
gold = "E8C25A"
gold_dark = "A87C2C"
# A unit that has moved: its own dimmed ramp (how much of the ramp's hue the grey keeps, and how bright it stays).
moved_tint = 0.5
moved_dim = 0.78

# ---- Infantry and Mech: AW2's soldiers wearing a galea (a Roman helmet) ----------------------------
# The picture is 16x16, three idle frames. `.` keeps AW2's pixel, `_` clears it, a hex digit is a unit palette index
# (2..7 the stone ramp light to dark, b c d the bronze light to dark, 1 white, e the crest red, f the outline). A patch
# with `moving = [..]` is also laid on those frames of the moving sheet (0..2 facing sideways, 3..5 front, 6..8 back),
# placed so its `anchor` (a point of `rows`) lies on the left outline of the helmet's top row.
[infantry]
base = 3

# side view: a rounded bronze bowl with a brow ridge, a thin red horsehair crest along its top (a slight arc), a cheek guard hanging in front of the ear and a
# neck guard flaring at the back
[[infantry.patch]]
x = 0
y = 0
moving = [0, 1, 2]
anchor = [6, 1]
rows = [
  "........eee.....",
  ".....feeeeeeef..",
  ".....fb1bbbcddf.",
  "....fbbbbbbccddf",
  "....fbbbbbbcccdf",
  "...fbbbbbbbbbbdf",
  "...fcdddddd.bcdf",
  "...........fbcdf",
  "...........fcddf",
  "............fddf",
]

# front: the crest seen head on, the dome with the crest's line down it, the brow band and the cheek guards
[[infantry.patch]]
frames = []
moving = [3, 4, 5]
anchor = [3, 2]
rows = [
  ".....ee.....",
  "............",
  "...fceecf...",
  "..fbbeeccf..",
  "..fbbeeccf..",
  ".fbbbeeccdf.",
  ".fcccccccdf.",
  "..c......c..",
]

# back: the crest's line down the dome, the neck guard
[[infantry.patch]]
frames = []
moving = [6, 7, 8]
anchor = [3, 2]
rows = [
  ".....ee.....",
  "............",
  "...fceecf...",
  "..fbbeeccf..",
  "..fbbeeccf..",
  ".fcccccccdf.",
  "..ccceeccd..",
]

[mech]
base = 3

# the Mech's head sits a pixel left and up of the Infantry's, with the launcher on its right: no neck guard
[[mech.patch]]
frames = [0, 1]
x = 0
y = 0
moving = [0, 1, 2]
anchor = [5, 0]
