# Tabitha, imported directly from tabitha_v1.jpg (the owner's pixel art, 1408 x 1408, native cells of about 4.4 x 4.0 px, 320 x 351). Coordinates are native cells of the picture as supplied (she faces front, a little to the left: kept).
pixelart = true
# The picture's "transparent" background is a checkerboard baked into the JPEG: the light, colourless pixels connected to the border become one flat white before the grid is found (`checker`);
# `checker_seeds` floods the three pockets of it enclosed by her arm and torso and under her hair (picture pixels).
checker = true
checker_seeds = [[565, 474], [570, 500], [560, 450], [775, 494], [790, 520], [770, 470], [644, 310], [650, 320]]
