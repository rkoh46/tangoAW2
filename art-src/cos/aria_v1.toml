# Her cigarette's smoke wisps (faint grey noise above the cigarette) are not her: native cells x 16..25, y 36..52.
erase = [[92, 36, 101, 52]]
# the white edge cells the JPEG leaves between the coat and the background (light grey, colourless) go; her cigarette's white paper (x 16..33, y 53..58) is kept.
