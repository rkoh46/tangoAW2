# Aria, imported directly from aria_v1.jpg (the owner's pixel art, 838 x 2000, native cells of 7 px: 118 x 279). Mirrored (flip = true) at the owner's request; coordinates are native cells of the mirrored grid.
pixelart = true
match = "lab"
flip = true      # mirrored at the owner's request: she faces the other way; all coordinates below are cells of the mirrored grid (x' = 117 - x)
# The picture's "transparent" background is a checkerboard baked into the JPEG (light grey and white squares): the light, colourless pixels connected to the border become one flat white before the grid is found
# (`checker`); `checker_seeds` floods the one pocket of it enclosed by her right arm and coat (picture pixels).
checker = true
checker_seeds = [[560, 700], [565, 650], [555, 740], [575, 690], [545, 720]]
# The squares' edges are strong in the edge profile; the cell's own period is 7 px (the strongest FFT peak of the vertical profile is a different one).
