outline = [0, 0, 0]
bg_tolerance = 40
large_scale = 1
frame = [-4, -2]
mug_scale = 1
mug = [37, 11]
# her cigarette's ember falls into the mug's lower left corner: not part of the face (native cells x 26..38, y 50..59).
