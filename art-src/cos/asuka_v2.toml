# Asuka, imported directly from asuka_v2.png (the owner's pixel art on a white background, native cells of about 7 px). Coordinates are native cells of the picture as it is: she faces right, like AW2's COs.
# A direct import: the native grid, the cell-centre resample, white cut to transparent, whole-cell framing, 15 colours. No peeling, despeckling or stray-cell removal: nothing changes her pixels (hole_min only clears the large enclosed pockets of white between her arm and body and behind her neck). The outline is only added outside the figure (diagonal corners too, so it is unbroken: the lint asks for that).
pixelart = true
match = "luma"
flip = false
outline_diagonal = true
hole_min = 30
# The white background's leftovers on her outer edge (light grey and near-white cells from the picture's anti-aliasing) go: the background grows from the outside through colourless cells lighter than Lab L 38 (the blended greys included). Cells enclosed by her (eye whites, buckle, badge) are never reached.
fringe = "light"
# The uniform's dark ramp (near-black, folds, pleats, sleeve and cap highlights) gets 5 palette entries of its own, so it is not merged into one black.
dark_ramp = 5
dark_ramp_c = 6
max_specks = 800
fringe_l = 38
outline = [0, 0, 0]
bg_tolerance = 40
large_scale = 1
frame = [45, -6]
mug_scale = 1
mug = [76, -2]
eyes = [100, 26, 118, 28]
# Colours her palette must keep an entry for (groups of native cells, the mean of each): the eye white, the grey iris, the skin, the gold badge, the red tie.
protect = [
  [[102, 25], [103, 25], [103, 26], [103, 24], [104, 24]],
  [[102, 23], [103, 23]],
  [[105, 28], [107, 28], [108, 28], [108, 27], [109, 27]],
  [[111, 5], [112, 5], [110, 6], [113, 6], [110, 7], [113, 7]],
  [[104, 60], [105, 61], [106, 62], [105, 62], [104, 61]],
]
