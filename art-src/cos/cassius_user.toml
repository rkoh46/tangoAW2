# Cassius, redrawn in AW2's CO style from cassius_user.jpg (the design reference: the stern dark-haired legionary in steel lorica segmentata with bronze shoulder plates and a red cloak).
# See devkit/aw2/colib/cel.py for the keys. Palette: 1 white, 2..6 skin (6 also the hair), 7..9 steel dark/base/light, 10..12 bronze dark/base/light, 13..14 red dark/base, 15 the outline.
scale = 0.135
crop_top = 45
top = 3
flip = true
face = [190, 70, 420]
eyes = [275, 268, 390, 263]
mouth = [340, 385]
nose = [312, 342]
fallback = "red"
default_variant = "B"

[face_style]
iris = 15
brow = 6
mouth = 5
lip = 4

[variant.A]      # closest to the picture's colours: darker, duller metal
palette = ["ffffff",
           "e0a878", "c08860", "9a6444", "704030", "2c2220",
           "404850", "78808a", "b0b4b8", "603c18", "a47030", "dcaa58", "5c1418", "983028",
           "201820"]
[variant.B]      # brighter and more saturated, like AW2's armoured COs
palette = ["ffffff",
           "ffcd8b", "ffac73", "cd7b5a", "a45a4a", "4a2c28",
           "4a5878", "8c98bc", "d5deee", "8a4a28", "d09030", "ffd860", "9c1c30", "d83040",
           "201820"]
[variant.C]      # simplified: two tones, bold lines
palette_from = "B"
tones = 2
min_blob = 5
tone_passes = 2
bold = true

[[material]]
name = "hair"
ramp = [15, 6]
rule = { val = [0.0, 0.34] }
within = [[[240,130],[260,85],[330,60],[430,65],[500,100],[545,180],[550,250],[500,250],[480,200],[450,150],[300,150],[250,170]]]
shine = true
[[material]]
