[package]
name = "tango-lobby"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# The netplay session state machine: connection choreography
# (Idle → Connecting → Negotiating → Lobby), the settings exchange, the
# ready-commitment handshake, and the handoff into a live match.
#
# Extracted from the tango bin crate so a second frontend drives the
# identical choreography rather than reimplementing it — getting that
# wrong is a desync, not a cosmetic bug. Bringing a connection up is a
# linear async fn and the lobby is a plain state machine, so a host
# supplies a spawner and a pump rather than an architecture.
#
# Sits on tango-net, which owns the transports this drives (signaling,
# the direct link, the two data channels, the link rebuild), and knows
# nothing of the library, sessions, or emulator backends.
#
# Builds for wasm32 minus the direct (signaling-free) transport, which
# needs a UDP socket the browser won't give us.
[dependencies]
futures.workspace = true
log.workspace = true
rand.workspace = true
bincode.workspace = true
semver.workspace = true
subtle.workspace = true
thiserror.workspace = true
# Sync primitives and `select!` only — the waiting and spawning here go
# through tango-platform, so there's no runtime to ask
# tokio for on either target.
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util.workspace = true
unic-langid.workspace = true
web-time.workspace = true
zstd.workspace = true

tango-net-protocol = { path = "../tango-net-protocol" }
tango-net = { path = "../tango-net" }
tango-platform = { path = "../tango-platform" }
tango-signaling.workspace = true

# The lobby browser's discovery over public Nostr relays (native only): a websocket over rustls (the stack the
# matchmaking client uses) and BIP-340 signatures, which Nostr events need.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
k256 = { version = "0.13", default-features = false, features = ["schnorr", "std"] }
serde_json.workspace = true
sha2 = "0.10"
tokio-tungstenite.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }

[dev-dependencies]
env_logger.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
